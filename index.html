<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware Party Games</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: monospace, sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ตารางคะแนนรวม */
    .party-header {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 2px solid #334155;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .score-row {
      display: flex;
      justify-content: space-around;
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
    }
    .p1-color { color: #38bdf8; }
    .p2-color { color: #f43f5e; }

    /* พื้นที่เล่นเกม */
    #arena {
      width: 100%;
      max-width: 480px;
      background: #020617;
      border: 2px solid #475569;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* การแสดงผลลูกโป่ง */
    .balloon-stage {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      width: 100%;
      height: 220px;
      margin: 15px 0;
    }
    .balloon-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 45%;
      height: 100%;
    }
    .balloon {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      transition: width 0.1s, height 0.1s;
    }
    .balloon-target { background: #facc15; }
    .balloon-p1 { background: #38bdf8; }
    .balloon-p2 { background: #f43f5e; }

    /* ปุ่มควบคุม */
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
    }
    button:disabled { background: #475569; }

    /* กล่อง Debug รับข้อมูลจาก Hardware */
    #debug-box {
      width: 100%;
      max-width: 480px;
      margin-top: 12px;
      background: #111;
      color: #4ade80;
      padding: 8px;
      font-size: 12px;
      height: 90px;
      overflow-y: auto;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- คะแนนรวมของทั้งปาร์ตี้ -->
  <div class="party-header">
    <div style="text-align:center; font-weight:bold;">🏆 TOTAL PARTY SCORE</div>
    <div class="score-row">
      <div class="p1-color">P1: <span id="total-p1">0</span> ดาว</div>
      <div class="p2-color">P2: <span id="total-p2">0</span> ดาว</div>
    </div>
  </div>

  <!-- โหมดมินิเกม: Balloon Memory Pump -->
  <div id="arena">
    <div id="game-title" style="font-weight: bold; color: #facc15;">MINI-GAME 1: BALLOON MEMORY PUMP</div>
    <div id="instruction" style="font-size: 13px; color: #94a3b8;">กดปุ่มเริ่มรอบเพื่อจำขนาดเป้าหมาย</div>

    <div class="balloon-stage">
      <!-- ฝั่ง P1 -->
      <div class="balloon-slot">
        <div id="balloon-p1" class="balloon balloon-p1" style="width: 30px; height: 30px;">0%</div>
        <span class="p1-color" style="margin-top:8px;">P1 (ปั๊มเอง)</span>
        <span id="p1-status" style="font-size: 12px; color: #94a3b8;">รอส่งค่า...</span>
      </div>

      <!-- เป้าหมายตรงกลาง (จะหายไปหลังหมดเวลา) -->
      <div class="balloon-slot" id="target-slot">
        <div id="balloon-target" class="balloon balloon-target" style="width: 30px; height: 30px;">?</div>
        <span style="color: #facc15; margin-top:8px;">TARGET</span>
      </div>

      <!-- ฝั่ง P2 -->
      <div class="balloon-slot">
        <div id="balloon-p2" class="balloon balloon-p2" style="width: 30px; height: 30px;">0%</div>
        <span class="p2-color" style="margin-top:8px;">P2 (ปั๊มเอง)</span>
        <span id="p2-status" style="font-size: 12px; color: #94a3b8;">รอส่งค่า...</span>
      </div>
    </div>

    <div id="result-text" style="font-weight: bold; min-height: 24px;"></div>
    <button id="start-btn" onclick="startRound()">เริ่มรอบใหม่ (3s จำขนาด)</button>
  </div>

  <div id="debug-box">--- MQTT Hardware Logs ---<br></div>

  <script>
    function log(msg) {
      const box = document.getElementById('debug-box');
      box.innerHTML += `> ${msg}<br>`;
      box.scrollTop = box.scrollHeight;
    }

    // ข้อมูลคะแนนรวม
    let totalScore = { p1: 0, p2: 0 };
    let gameState = 'IDLE'; // IDLE, MEMORIZE, PLAYING, ROUND_OVER
    let targetSize = 0; // ขนาดเป้าหมาย (30px - 140px)
    
    // ข้อมูลของผู้เล่นในแต่ละรอบ
    let p1Data = { current: 30, locked: false, popped: false };
    let p2Data = { current: 30, locked: false, popped: false };

    // DOM Elements
    const bTarget = document.getElementById('balloon-target');
    const bP1 = document.getElementById('balloon-p1');
    const bP2 = document.getElementById('balloon-p2');
    const targetSlot = document.getElementById('target-slot');
    const instruction = document.getElementById('instruction');
    const resultText = document.getElementById('result-text');
    const startBtn = document.getElementById('start-btn');

    // --- เชื่อมต่อ MQTT Broker ---
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    client.on('connect', () => {
      log('Connected to MQTT Broker.');
      // บอร์ดส่งค่าผ่าน Topic: mygame/p1/data และ mygame/p2/data
      client.subscribe(['mygame/p1/data', 'mygame/p2/data']);
    });

    // เริ่มรอบเกม
    function startRound() {
      gameState = 'MEMORIZE';
      startBtn.disabled = true;
      resultText.textContent = '';
      
      // รีเซ็ตสถานะผู้เล่น
      p1Data = { current: 30, locked: false, popped: false };
      p2Data = { current: 30, locked: false, popped: false };
      updateBalloon(bP1, 30);
      updateBalloon(bP2, 30);
      document.getElementById('p1-status').textContent = 'กำลังปั๊ม...';
      document.getElementById('p2-status').textContent = 'กำลังปั๊ม...';

      // สุ่มขนาดเป้าหมาย (60px ถึง 150px)
      targetSize = Math.floor(Math.random() * 90) + 60;
      targetSlot.style.visibility = 'visible';
      updateBalloon(bTarget, targetSize);
      bTarget.textContent = 'จำไว้!';

      instruction.textContent = 'จำขนาดลูกโป่งสีเหลืองนี้ให้ดี! (3 วินาที)';

      // นับถอยหลัง 3 วินาที แล้วซ่อนเป้าหมาย ให้เริ่มปั๊ม
      setTimeout(() => {
        targetSlot.style.visibility = 'hidden';
        gameState = 'PLAYING';
        instruction.textContent = 'เริ่มปั๊มมือ! แล้วกดปุ่มล็อกผลบน Keypad';
      }, 3000);
    }

    function updateBalloon(el, size) {
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.textContent = Math.round(size);
    }

    // ประมวลผลข้อมูลที่ส่งมาจาก Arduino
    client.on('message', (topic, message) => {
      try {
        const payload = JSON.parse(message.toString());
        // รูปแบบ JSON ที่ส่งมา: {"val": 75, "lock": true}
        if (topic === 'mygame/p1/data') handlePlayerUpdate(1, payload);
        if (topic === 'mygame/p2/data') handlePlayerUpdate(2, payload);
      } catch(e) {
        // รองรับกรณีส่งข้อความธรรมดา (fallback)
        log(`Parse error on ${topic}: ${message.toString()}`);
      }
    });

    function handlePlayerUpdate(playerId, data) {
      if (gameState !== 'PLAYING') return;

      let p = (playerId === 1) ? p1Data : p2Data;
      let el = (playerId === 1) ? bP1 : bP2;
      let statusEl = document.getElementById(playerId === 1 ? 'p1-status' : 'p2-status');

      if (p.locked) return; // ล็อกคะแนนแล้วไม่รับค่าเพิ่ม

      // อัปเดตขนาดตามจำนวนที่ปั๊ม
      p.current = Math.max(30, data.val);
      updateBalloon(el, p.current);

      // ถ้าปั๊มเกินขนาดเกินไป (เช่น เกินเป้า 25px) ถือว่าแตกทันที
      if (p.current > targetSize + 25) {
        p.popped = true;
        p.locked = true;
        el.textContent = 'แตก!';
        el.style.background = '#475569';
        statusEl.textContent = '💥 ลูกโป่งแตก!';
      }

      // เมื่อผู้เล่นกดปุ่มล็อกผลบน Keypad (เช่น ส่ง lock: true)
      if (data.lock && !p.locked) {
        p.locked = true;
        statusEl.textContent = '🔒 ล็อกผลแล้ว';
      }

      // ถ้าทั้งสองคนล็อกผลแล้ว ให้ตัดสินคะแนน
      if (p1Data.locked && p2Data.locked) {
        evaluateWinner();
      }
    }

    // ตัดสินผลแพ้ชนะ
    function evaluateWinner() {
      gameState = 'ROUND_OVER';
      targetSlot.style.visibility = 'visible'; // เฉลยเป้าหมาย
      bTarget.textContent = targetSize;

      let diff1 = p1Data.popped ? 999 : Math.abs(p1Data.current - targetSize);
      let diff2 = p2Data.popped ? 999 : Math.abs(p2Data.current - targetSize);

      if (diff1 === 999 && diff2 === 999) {
        resultText.textContent = '💥 ลูกโป่งแตกทั้งคู่ ไม่มีใครได้แต้ม!';
      } else if (diff1 < diff2) {
        resultText.textContent = '🎉 PLAYER 1 ชนะรอบนี้! (ใกล้เคียงที่สุด)';
        totalScore.p1++;
      } else if (diff2 < diff1) {
        resultText.textContent = '🎉 PLAYER 2 ชนะรอบนี้! (ใกล้เคียงที่สุด)';
        totalScore.p2++;
      } else {
        resultText.textContent = '🤝 เสมอกัน!';
      }

      document.getElementById('total-p1').textContent = totalScore.p1;
      document.getElementById('total-p2').textContent = totalScore.p2;
      startBtn.disabled = false;
      instruction.textContent = 'จบรอบแล้ว กดเริ่มรอบถัดไปได้เลย';
    }

    // ปุ่มจำลองการทดสอบบนคีย์บอร์ดคอมพิวเตอร์
    // P1: กด 'W' เพื่อปั๊ม, 'S' เพื่อล็อกผล
    // P2: กด 'ArrowUp' เพื่อปั๊ม, 'ArrowDown' เพื่อล็อกผล
    window.addEventListener('keydown', (e) => {
      if (e.key === 'w') handlePlayerUpdate(1, { val: p1Data.current + 8, lock: false });
      if (e.key === 's') handlePlayerUpdate(1, { val: p1Data.current, lock: true });
      if (e.key === 'ArrowUp') handlePlayerUpdate(2, { val: p2Data.current + 8, lock: false });
      if (e.key === 'ArrowDown') handlePlayerUpdate(2, { val: p2Data.current, lock: true });
    });
  </script>
</body>
</html>
